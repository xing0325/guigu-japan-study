<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>龟谷 · 去日本，从这里开始</title><link rel="stylesheet" href="vendor/maplibre-gl.css"><link rel="stylesheet" href="mobile.css"></head><body>
<div class="app" id="app"><header class="header"><button class="brand" data-action="new-chat" aria-label="龟谷，开始新对话">龟谷</button><nav><button class="icon-btn" data-action="history" aria-label="打开我的方案"><i data-icon="clock"></i></button><button class="icon-btn" data-action="profile" aria-label="我的条件"><i data-icon="user"></i></button></nav></header>
<main class="scroll-area" id="scroll-area"><div class="welcome" id="welcome"><h1>去日本，<br>从一个想法开始。</h1><p class="welcome-sub">关于留学，你想先聊什么？</p><div class="suggestions"><button data-prompt="先看看东京的学校">看看学校</button><button data-prompt="帮我算一算首年预算">算算预算</button><button data-prompt="我想了解申请和签证准备">准备申请</button></div></div><div id="messages" class="messages" role="log" aria-live="polite" aria-label="与龟谷的对话"></div><div id="scroll-end"></div></main>
<div class="composer-wrap"><button class="plan-peek" id="plan-peek" data-action="saved" hidden><span><i data-icon="bookmark"></i> 我的候选 <b id="saved-count">0</b></span><span>继续比较 <i data-icon="arrow-right"></i></span></button><div class="context-chip" id="context-chip" hidden><span id="context-text"></span><button data-action="clear-context" aria-label="取消引用">×</button></div><form id="composer" class="composer"><textarea id="prompt" rows="1" placeholder="输入你的想法…" aria-label="发送消息给龟谷"></textarea><div class="composer-bottom"><div class="composer-tools"><button type="button" class="icon-btn" data-action="upload" aria-label="添加资料"><i data-icon="plus"></i></button></div><button type="submit" class="send-btn" id="send" aria-label="发送消息"><i data-icon="arrow-up"></i></button></div></form><div class="composer-note">交互原型 · 回复为演示</div></div></div>
<dialog id="sheet" class="sheet"><div class="sheet-grab" aria-hidden="true"></div><header class="sheet-header"><div><h2 id="sheet-title"></h2></div><button class="icon-btn" id="sheet-close" aria-label="关闭面板"><i data-icon="x"></i></button></header><div id="sheet-content" class="sheet-content"></div></dialog><input id="file-input" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt" hidden><div class="toast" id="toast" role="status"></div><script src="vendor/maplibre-gl.js"></script><script src="mobile.js"></script></body></html>
